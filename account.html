<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Patron Account | Himalayan Hearth</title>
  <meta name="description" content="View your order history, saved addresses, and profile." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <header class="site-header">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon-box">
          <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
        </div>
        <div class="brand-text-col">
          <span class="brand-name">Himalayan Hearth</span>
          <span class="brand-tagline">Fine Dining & Himalayan Spirits</span>
        </div>
      </a>

      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="menu.html" class="nav-link">Menu & Order</a>
        <a href="cart.html" class="nav-link">Cart</a>
        <a href="account.html" class="nav-link active">Account</a>
      </nav>

      <div class="nav-actions">
        <a href="cart.html" class="cart-btn-trigger" aria-label="Cart">
          <span class="material-symbols-outlined text-xl">shopping_bag</span>
          <span class="cart-badge-count" style="display:none;">0</span>
        </a>
        <a href="menu.html" class="btn-primary btn-sm">
          <span>Order Now</span>
        </a>
      </div>
    </div>
  </header>

  <main style="margin-top: 130px; padding-bottom: 6rem;">
    <div class="container" id="accountContainer">
      <!-- Rendered dynamically by /js/authentication.js -->
      <div style="text-align: center; padding: 4rem;">
        <span class="material-symbols-outlined text-primary text-3xl" style="animation: spin 1s infinite linear;">sync</span>
        <p style="color:var(--text-muted); margin-top:1rem;">Loading your patron profile...</p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <p>© 2026 Himalayan Hearth Pvt. Ltd. Kathmandu, Nepal.</p>
        <div style="display:flex; gap:1.5rem;">
          <a href="menu.html">Menu</a>
          <a href="cart.html">Cart</a>
          <a href="track-order.html">Track Order</a>
        </div>
      </div>
    </div>
  </footer>

  <div id="toast-container"></div>

  <script type="module" src="/js/main.js"></script>
  <script type="module" src="/js/authentication.js"></script>
</body>
</html>
