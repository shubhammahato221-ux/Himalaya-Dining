<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login | Himalayan Hearth</title>
  <meta name="description" content="Sign in to your Himalayan Hearth patron account to track orders and manage delivery addresses." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <header class="site-header">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon-box">
          <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
        </div>
        <div class="brand-text-col">
          <span class="brand-name">Himalayan Hearth</span>
          <span class="brand-tagline">Fine Dining & Himalayan Spirits</span>
        </div>
      </a>

      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="menu.html" class="nav-link">Menu & Order</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </nav>

      <div class="nav-actions">
        <a href="register.html" class="btn-outline btn-sm">
          <span>Create Account</span>
        </a>
      </div>
    </div>
  </header>

  <main style="margin-top: 130px; padding-bottom: 6rem; min-height: 75vh; display: flex; align-items: center;">
    <div class="container" style="max-width: 480px;">
      <div class="hearth-card" style="padding: 2.5rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
          <span class="label-caps" style="color:var(--primary);">Hearth Patron Portal</span>
          <h1 class="font-serif" style="font-size: 2rem; color: var(--text-main); margin-top: 0.25rem;">Sign In</h1>
          <p style="color: var(--text-muted); font-size: 0.875rem; margin-top: 0.25rem;">Access your Kathmandu order history and addresses.</p>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label class="form-label" for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail" class="form-control" value="maya.shrestha@example.com" placeholder="name@domain.com" required>
          </div>

          <div class="form-group" style="margin-bottom: 1.5rem;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <label class="form-label" for="loginPassword">Password</label>
              <a href="#" onclick="alert('Password reset instructions sent to your email.')" style="font-size:0.75rem; color:var(--primary);">Forgot?</a>
            </div>
            <input type="password" id="loginPassword" class="form-control" value="kathmandu123" required>
          </div>

          <button type="submit" class="btn-primary" style="width: 100%; height: 48px; font-size: 0.8125rem;">
            <span>Sign In to Account</span>
            <span class="material-symbols-outlined text-sm">arrow_forward</span>
          </button>
        </form>

        <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px dashed var(--outline-hairline); text-align: center;">
          <button id="demoLoginBtn" class="btn-outline btn-sm" style="width: 100%;">
            ⚡ 1-Click Fast Login as Maya Shrestha
          </button>
        </div>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-dim);">
          New patron? <a href="register.html" style="color:var(--primary); font-weight:600;">Register an account</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <p>© 2026 Himalayan Hearth Pvt. Ltd. Kathmandu, Nepal.</p>
      </div>
    </div>
  </footer>

  <div id="toast-container"></div>

  <script type="module" src="/js/main.js"></script>
  <script type="module" src="/js/authentication.js"></script>
</body>
</html>
