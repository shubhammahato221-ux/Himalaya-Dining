<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patron Registration | Himalayan Hearth</title>
  <meta name="description" content="Register an account with Himalayan Hearth for personalized dining and online order tracking." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <header class="site-header">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon-box">
          <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
        </div>
        <div class="brand-text-col">
          <span class="brand-name">Himalayan Hearth</span>
          <span class="brand-tagline">Fine Dining & Himalayan Spirits</span>
        </div>
      </a>

      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="menu.html" class="nav-link">Menu & Order</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </nav>

      <div class="nav-actions">
        <a href="login.html" class="btn-outline btn-sm">
          <span>Sign In</span>
        </a>
      </div>
    </div>
  </header>

  <main style="margin-top: 130px; padding-bottom: 6rem; min-height: 75vh; display: flex; align-items: center;">
    <div class="container" style="max-width: 500px;">
      <div class="hearth-card" style="padding: 2.5rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
          <span class="label-caps" style="color:var(--primary);">Himalayan Hearth Club</span>
          <h1 class="font-serif" style="font-size: 2rem; color: var(--text-main); margin-top: 0.25rem;">Create Account</h1>
          <p style="color: var(--text-muted); font-size: 0.875rem; margin-top: 0.25rem;">Join our community of Himalayan food lovers in Nepal.</p>
        </div>

        <form id="registerForm">
          <div class="form-group">
            <label class="form-label" for="regName">Full Name *</label>
            <input type="text" id="regName" class="form-control" placeholder="e.g. Maya Shrestha" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="regPhone">Nepal Mobile Number *</label>
            <input type="tel" id="regPhone" class="form-control" placeholder="+977 9801234567" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="regEmail">Email Address *</label>
            <input type="email" id="regEmail" class="form-control" placeholder="name@domain.com" required>
          </div>

          <div class="form-group" style="margin-bottom: 1.75rem;">
            <label class="form-label" for="regPassword">Password *</label>
            <input type="password" id="regPassword" class="form-control" placeholder="Minimum 6 characters" required>
          </div>

          <button type="submit" class="btn-primary" style="width: 100%; height: 48px; font-size: 0.8125rem;">
            <span>Complete Registration</span>
            <span class="material-symbols-outlined text-sm">arrow_forward</span>
          </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-dim);">
          Already have an account? <a href="login.html" style="color:var(--primary); font-weight:600;">Sign in here</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <p>© 2026 Himalayan Hearth Pvt. Ltd. Kathmandu, Nepal.</p>
      </div>
    </div>
  </footer>

  <div id="toast-container"></div>

  <script type="module" src="/js/main.js"></script>
  <script type="module" src="/js/authentication.js"></script>
</body>
</html>
